name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Check docs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-docs.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-docs.ps1

  build-and-test:
    name: Build & Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debug & Release and run tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Config all -Test
